<title>筋肉カードゲーム 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
/* Layout: a fixed 960x540 landscape stage, scaled to fit the screen (Slay the Spire style battle layout) */
:root{
  --bg:#0f0d0b; --panel:#24201b; --panel2:#2f2a24; --line:#4a423a;
  --fg:#f3ece2; --muted:#b3a79a; --dim:#7d7368;
  --red:#d2492e; --red-l:#f1c9b8; --blue:#3e7cc4; --purple:#8a5cc0; --gold:#e9b13a;
  --green:#6dbb6a; --orange:#e8603f; --cream:#fff6e8; --ink:#1e1a17;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:500;font-size:14px;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#wrap{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#15120f}
button{font-family:var(--body);font-weight:700;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--red);border-color:#ff8a6a;color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
h2{font-size:22px} h3{font-size:16px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#000c,#0006);z-index:30;font-size:13px}
.top .stat{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.top .stat b{font-family:var(--display);font-weight:400;font-size:15px}
.top .hp b{color:#ff7a6a} .top .gold b{color:var(--gold)}
.top .sep{flex:1}
.ibtn{padding:4px 10px;font-size:12px;border-radius:8px;background:#0008}
.supp{border-style:dashed;border-color:#7ec3ff;color:#bfe0ff}
.gearrow{display:flex;gap:4px;max-width:300px;overflow:hidden}
.gear{font-size:11px;padding:3px 6px;border-radius:6px;background:#0008;white-space:nowrap}

/* battle scene */
.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:brightness(.62) saturate(.9)}
.floorshade{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,#0a0806e8 60%)}
.unit{position:absolute;bottom:200px;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);background:none;border:0;padding:0;border-radius:0;cursor:default}
.unit img.spr{image-rendering:pixelated;display:block;filter:drop-shadow(0 6px 0 #0006)}
.unit.target{cursor:pointer}
.unit.target img.spr{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.unit.dead{opacity:0;pointer-events:none;transition:opacity .4s}
.unit.hit img.spr{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.hpwrap{margin-top:6px;display:flex;align-items:center;gap:4px}
.hpb{width:130px;height:12px;border-radius:6px;background:#2a0f0b;border:1px solid #000;position:relative;overflow:hidden}
.hpb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff6a50,#c43a22)}
.hpb.blocked i{background:linear-gradient(#7fb3ff,#3b6fc0)}
.hpb span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:800;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.blk{min-width:24px;height:24px;border-radius:6px;background:#2f5d8a;border:2px solid #9cc6ff;display:grid;place-items:center;font-family:var(--display);font-size:12px}
.sts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:170px}
.sts span{font-size:10px;padding:1px 5px;border-radius:5px;background:#000a;border:1px solid #fff3}
.intent{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;pointer-events:none}
.intent .ic{display:flex;gap:4px;align-items:center;font-family:var(--display);font-size:18px;text-shadow:0 2px 0 #000}
.intent .q{font-size:11px;background:#000b;border-radius:6px;padding:2px 6px;color:#ffe9d6}
.ic .atk{color:#ff7a5a} .ic .def{color:#8fc2ff} .ic .buf{color:#ffd36b} .ic .deb{color:#d7a6ff}
.ename{font-size:11px;background:#000a;border-radius:5px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.float{position:absolute;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 3px 0 #000,0 0 8px #f00;pointer-events:none;animation:floatup .9s ease-out forwards;z-index:60}
.float.me{text-shadow:0 3px 0 #000,0 0 8px #f60}
.float.blkf{text-shadow:0 3px 0 #000,0 0 8px #39f}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-50px);opacity:0}}
@media (prefers-reduced-motion:reduce){.unit.hit img.spr,.float{animation:none}}

.energy{position:absolute;left:28px;bottom:78px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;
  background:radial-gradient(circle at 35% 30%,#ffb26b,#d2492e 55%,#5c1a0f);border:3px solid #ffd6a8;box-shadow:0 0 18px #ff6a3a88;text-shadow:0 2px 0 #000;z-index:20}
.energy.empty{filter:grayscale(.8) brightness(.7);box-shadow:none}
.pile{position:absolute;bottom:14px;width:62px;height:58px;border-radius:10px;background:#000b;border:1px solid #fff3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;z-index:20;padding:0}
.pile b{font-family:var(--display);font-weight:400;font-size:18px}
.endturn{position:absolute;right:22px;bottom:96px;z-index:20;font-family:var(--display);font-weight:400;font-size:16px;padding:12px 18px;border-radius:14px;box-shadow:0 4px 0 #6d2010}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:46px;font-size:13px;background:#000c;border:1px solid var(--gold);color:#ffe7a8;border-radius:8px;padding:4px 12px;z-index:25;white-space:nowrap}
.log{position:absolute;left:50%;transform:translateX(-50%);top:46px;font-size:12px;background:#000a;border-radius:8px;padding:3px 10px;color:var(--muted);z-index:24;max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hand */
.hand{position:absolute;left:0;right:0;bottom:0;height:200px;z-index:40;pointer-events:none}
.hcard{position:absolute;bottom:-34px;width:122px;transform-origin:50% 120%;transition:transform .15s,bottom .15s;pointer-events:auto;background:none;border:0;padding:0;border-radius:0}
.hcard.sel{z-index:50 !important;bottom:60px}
.hcard.off .card{filter:brightness(.6)}
.hcard:focus-visible{outline:none}
.hcard:focus-visible .card{outline:3px solid var(--gold)}

/* card component (Nano Banana frame + overlays, sized by container width) */
.card{position:relative;width:100%;aspect-ratio:1728/2432;container-type:inline-size;text-align:left;color:var(--ink)}
.card .fr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card .ab{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .nm{color:#fff;font-family:var(--display);font-size:7.2cqw;line-height:1;justify-content:flex-start;padding-left:15cqw;white-space:nowrap;letter-spacing:-.02em}
.card .nm.long{font-size:5.6cqw}
.card .art img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.card .art .ph{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a332d,#1a1613);color:#5d544b;font-family:var(--display);font-size:17cqw}
.card .art .ph img{width:22cqw;height:auto;object-fit:contain;image-rendering:pixelated;opacity:.9}
.card .band{position:absolute;left:0;right:0;bottom:0;height:16%;background:#0009;color:#fff;font-size:4.6cqw;font-weight:700;display:flex;align-items:center;justify-content:center;gap:1.5cqw}
.gem{width:3.4cqw;height:3.4cqw;transform:rotate(45deg);display:inline-block;flex:none}
.gem.C{background:#cfc8bf} .gem.U{background:#7ec3ff} .gem.R{background:#ffd24a} .gem.S{background:#8a8178}
.card .eff{font-size:7.2cqw;font-weight:800;line-height:1.25;text-align:center;padding:0 3cqw;flex-direction:column}
.card .eff.sm{font-size:5.8cqw}
.card .cell{font-weight:800;font-size:6.5cqw;color:#b5aba3;flex-direction:column;line-height:1;border-radius:1.4cqw}
.card .cell.p2{background:#c9492f;color:#fff}
.card .cell.p1{background:#f1c9b8;color:#5e1d0f}
.card .cell i{font-style:normal;font-size:5cqw;letter-spacing:.3cqw}
.card .seg{background:#e8603f;border-radius:.6cqw}
.card .wl{color:#d8cabb;font-weight:800;font-size:4.6cqw}
.card .wr{color:#fff;flex-direction:column;line-height:1.05;overflow:visible;white-space:nowrap}
.card .wr b{font-family:var(--display);font-weight:400;font-size:4.6cqw}
.card .wr small{font-size:2.9cqw;color:#d8cabb;font-weight:700}
.card .plate{position:absolute;left:-4%;top:-3%;width:23%;aspect-ratio:1;pointer-events:none}
.card .plate img{width:100%;height:100%}
.card .plate b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:11cqw;color:#fff;-webkit-text-stroke:.9cqw #1a1613;paint-order:stroke fill}
.card.cu .fr{filter:grayscale(1) brightness(.7)}
.upmark{color:var(--gold)}

/* panels for non-battle screens */
.screen{position:absolute;left:0;right:0;top:38px;bottom:0;overflow:auto;padding:14px 24px 24px;display:flex;flex-direction:column;gap:12px}
.screen.center{align-items:center}
.panel{background:#24201be8;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:880px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cards .cw{width:132px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;border-radius:0}
.cards .cw.big{width:160px}
.cards .cw.off{opacity:.5}
.price{font-family:var(--display);color:var(--gold);font-size:14px}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.choice{text-align:left;display:flex;flex-direction:column;gap:2px}
.choice small{color:var(--muted);font-weight:500}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.badge-up{color:var(--gold);font-weight:800}

/* body parts */
.bodyparts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bp{background:var(--panel2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.bp .t{display:flex;justify-content:space-between;align-items:baseline}
.bp .t b{font-family:var(--display);font-weight:400;font-size:16px}
.xp{height:6px;background:#3a332d;border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold)}
.stim{font-size:11px;color:var(--gold)}

/* map */
.mapwrap{position:absolute;left:0;right:0;top:38px;bottom:0;overflow:auto;background:radial-gradient(circle at 50% 30%,#2c261f,#15120f)}
.mapinner{position:relative;width:520px;margin:0 auto}
.mapinner svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-family:var(--display);font-size:13px;border:2px solid var(--line);background:var(--panel)}
.node.n-elite{color:var(--orange);border-color:#7a3a28} .node.n-rest{color:var(--green)} .node.n-shop{color:var(--gold)} .node.n-event{color:#9fc3ff} .node.n-chest{color:var(--gold)}
.node.n-boss{width:70px;height:70px;font-size:16px;color:#fff;background:var(--red);border-color:var(--red)}
.node.avail{border-color:var(--gold);box-shadow:0 0 0 4px #e9b13a40;animation:pulse 1.4s infinite}
.node.done{opacity:.35} .node.here{background:var(--gold);color:var(--ink);opacity:1}
@keyframes pulse{50%{box-shadow:0 0 0 9px #e9b13a14}}
@media (prefers-reduced-motion:reduce){.node.avail{animation:none}}
.maplegend{position:absolute;left:14px;top:52px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);background:#000a;border-radius:10px;padding:10px;z-index:5}
.maptitle{position:absolute;right:14px;top:52px;z-index:5;text-align:right;background:#000a;border-radius:10px;padding:10px}

/* modal (inside stage) */
.modal{position:absolute;inset:0;background:#0a0806d0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:900px;width:100%;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

/* title */
.title{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:30px 40px}
.title h1{font-size:46px;line-height:1.1}
.title h1 em{font-style:normal;color:var(--red)}
.rules{font-size:13px;color:var(--muted);line-height:1.75}
.hero{position:relative;height:420px}
.hero img{position:absolute;bottom:0;image-rendering:pixelated}

/* rotate hint */
#rot{position:fixed;inset:0;z-index:100;background:#0f0d0bf2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#rot .ph{width:60px;height:100px;border:4px solid var(--fg);border-radius:12px;animation:rot 1.8s infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
#scene{position:absolute;inset:0}
</style>

<div id="wrap"><div id="stage"></div></div>

 sh_press:{n:'ダンベルショルダープレス',t:'tr',eq:'dumbbell',c:1,r:'C',p:{shoulder:2,arm:1},m:'shoulder',w:[12,20,3,'kg'],v:{d:4,h:2},u:{d:6,h:2}},

// ====== weight / upgrade ======
function cardLevelInfo(def){
  if(!def.w)return null;
  const [st,goal,req,unit]=def.w;
  const L=def.m==='all'?Math.min(...PARTS.map(partLevel)):partLevel(def.m);
  return {st,goal,req,unit,L,step:(goal-st)/req};
}
function tierOf(def){
  const i=cardLevelInfo(def); if(!i)return 0;
  if(i.L<i.req)return 0;
  return def.big3?1+Math.floor((i.L-i.req)/2):1;
}
function fmtW(v,unit){const x=Math.round(v*2)/2;return (Number.isInteger(x)?x:x.toFixed(1))+(unit==='kg'?'kg':unit==='回'?'回':'')}
function weightView(def){
  const i=cardLevelInfo(def); if(!i)return null;
  if(i.unit==='体操'){const t=tierOf(def);return {lab:t?'第2':'第1',goal:t?'':'/ 第2',frac:t?1:Math.min(1,i.L/i.req)}}
  const cur=i.st+i.step*i.L, t=tierOf(def);
  if(!def.big3){
    if(t)return {lab:fmtW(cur,i.unit),goal:'',frac:1};
    return {lab:fmtW(cur,i.unit),goal:'/ '+fmtW(i.goal,i.unit),frac:i.L/i.req};
  }
  const nextL=t===0?i.req:i.req+2*t, prevL=t===0?0:i.req+2*(t-1);
  return {lab:fmtW(cur,i.unit),goal:'/ '+fmtW(i.st+i.step*nextL,i.unit),frac:(i.L-prevL)/(nextL-prevL)};
}
function vals(id){
  const def=CARDS[id]; const t=tierOf(def);
  const v=Object.assign({},def.v,t&&def.u?def.u:{});
  if(def.big3&&t>1){v.d+=4*(t-1)}
  v.name=(t&&def.u&&def.u.n)?def.u.n:def.n+(t?(def.big3?'+'.repeat(t):'+'):'');
  v.tier=t;
  return v;
}

// ====== map ======
function genMap(){
  const ROWS=15, rows=[];
  for(let r=0;r<ROWS-1;r++){
    const n=r===0?3:rnd(2,4); const cols=shuffle([0,1,2,3]).slice(0,n).sort((a,b)=>a-b);
    rows.push(cols.map(c=>({r,c,type:'enemy',to:[]})));
  }
  rows.push([{r:ROWS-1,c:1.5,type:'boss',to:[]}]);
  for(let r=0;r<ROWS-2;r++){
    const cur=rows[r],nx=rows[r+1];
    cur.forEach((a,ai)=>{
      let cand=nx.map((b,bi)=>bi).filter(bi=>Math.abs(nx[bi].c-a.c)<=1);
      if(!cand.length){cand=[nx.reduce((best,b,bi)=>Math.abs(b.c-a.c)<Math.abs(nx[best].c-a.c)?bi:best,0)]}
      shuffle(cand).slice(0,Math.random()<0.4?2:1).forEach(bi=>{if(!a.to.includes(bi))a.to.push(bi)});
    });
    nx.forEach((b,bi)=>{
      if(!cur.some(a=>a.to.includes(bi))){
        const ai=cur.reduce((best,a,i)=>Math.abs(a.c-b.c)<Math.abs(cur[best].c-b.c)?i:best,0);
        cur[ai].to.push(bi);
      }
    });
  }
  rows[ROWS-2].forEach(a=>a.to=[0]);
  for(let r=1;r<ROWS-1;r++)rows[r].forEach(nd=>{
    if(r===7){nd.type='chest';return}
    if(r===13){nd.type='rest';return}
    const opts=[['enemy',48],['event',22]];
    if(r>=3)opts.push(['shop',8]);
    if(r>=4)opts.push(['elite',11]);
    if(r>=5&&r!==12)opts.push(['rest',11]);
    let tot=opts.reduce((s,o)=>s+o[1],0),x=Math.random()*tot;
    for(const [t,w] of opts){if((x-=w)<0){nd.type=t;break}}
  });
  return rows;
}

function startCombat(ids,kind){
  const enemies=ids.map(id=>{const e=ENEMIES[id];const hp=rnd(e.hp[0],e.hp[1]);return {id,n:e.n,hp,max:hp,block:0,pump:0,wk:0,vu:0,mi:0}});
  const draw=shuffle(S.deck.map(c=>({...c})));
  const C=S.combat={kind,enemies,draw,hand:[],discard:[],exhaust:[],energy:3,turn:0,block:0,pump:0,dex:0,wk:0,vu:0,tempPump:0,
    pw:{},stim:Object.fromEntries(PARTS.map(p=>[p,0])),stimMult:1,talk:0,last:null,sel:null,log:'',allOutUsed:false};
  if(S.gears.includes('wrap'))C.pump+=1;
  if(S.gears.includes('shaker'))C.startBlock=(C.startBlock||0)+8;
  if(S.gears.includes('mirror_g'))C.startBlock=(C.startBlock||0)+2*Math.min(...PARTS.map(partLevel));
  if(S.gears.includes('benchrack')&&S.deck.some(c=>c.id==='bench')){const w=CARDS.bench.w;const kg=w[0]+(w[1]-w[0])/w[2]*partLevel('chest');C.pump+=Math.floor(kg/40)}
  S.screen='combat';
  startTurn();
}
function drawCards(n){
  const C=S.combat;
  for(let k=0;k<n;k++){
    if(!C.draw.length){if(!C.discard.length)break;C.draw=shuffle(C.discard);C.discard=[]}
    if(C.hand.length>=10)break;
    C.hand.push(C.draw.pop());
  }
}
function startTurn(){
  const C=S.combat; C.turn++; C.block=C.turn===1?(C.startBlock||0):0; C.energy=3; C.allOutUsed=false;
  if(S.gears.includes('hrm')&&C.turn===3)C.energy+=2;
  if(C.pw.whey)C.block+=3*C.pw.whey;
  if(C.pw.dirty){C.pump+=2*C.pw.dirty;C.dex-=C.pw.dirty}
  drawCards(5+(C.turn===1&&S.gears.includes('gymbag')?2:0));
  C.sel=null;
}
function alive(){return S.combat.enemies.filter(e=>e.hp>0)}
function curMove(e){return ENEMIES[e.id].moves[e.mi%ENEMIES[e.id].moves.length]}

function baseDamage(id,v){
  const def=CARDS[id];
  if(v.pose==='fdb')return PARTS.reduce((s,p)=>s+partLevel(p),0);
  if(v.pose==='sc')return (partLevel('chest')+partLevel('arm'))*2;
  let d=v.d||0;
  if(S.gears.includes('grip')&&def.m==='back'&&partLevel('back')>=5)d+=2;
  return d;
}
function dealt(d,target){
  const C=S.combat; d+=C.pump+C.tempPump;
  if(C.wk>0)d=Math.floor(d*0.75);
  if(target&&target.vu>0)d=Math.floor(d*1.5);
  return Math.max(0,d);
}
function focusGain(b){return Math.max(0,b+S.combat.dex)}
function needsTarget(id){const v=CARDS[id].v;return CARDS[id].t==='tr'||v.vu||v.wk}

function cardText(id,inCombat){
  const def=CARDS[id], v=vals(id); const L=[];
  const C=inCombat?S.combat:null;
  if(def.t==='cu')return v.curse;
  if(v.pose==='fdb')L.push(`全部位のレベル合計のダメージ（今：${inCombat?dealt(baseDamage(id,v)):baseDamage(id,v)}）`);
  else if(v.pose==='sc')L.push(`（胸＋腕のレベル）×2のダメージ（今：${inCombat?dealt(baseDamage(id,v)):baseDamage(id,v)}）`);
  else if(v.d!=null){
    let d=baseDamage(id,v); if(C){d=dealt(d+(C.pw.split&&C.last&&C.last.t==='tr'&&C.last.m&&def.m&&C.last.m!==def.m?3*C.pw.split:0))}
    L.push(`${d}ダメージ${v.h>1?` × ${v.h}回`:''}`);
  }
  if(v.combo)L.push(`直前に${PJL[def.m]}のカードなら、もう1回`);
  if(v.b)L.push(`フォーカス${C?focusGain(v.b):v.b}`);
  if(v.vu)L.push(`相手に動揺${v.vu}`);
  if(v.wk)L.push(`相手にバテ${v.wk}`);
  if(v.dr)L.push(`カードを${v.dr}枚引く`);
  if(v.self)L.push(`自分のメンタル-${v.self}`);
  if(v.radio)L.push('全部位に刺激+1');
  if(v.cl==='vuln')L.push('自分の動揺を消す');
  if(v.cl==='weak')L.push('自分のバテを消す');
  if(v.talk)L.push('次のトレーニングの部位の刺激が2倍');
  if(v.pw==='whey')L.push('毎ターン、フォーカス+3');
  if(v.pw==='split')L.push('直前と違う部位のトレーニングを使うと、ダメージ+3');
  if(v.pw==='dirty')L.push('毎ターン、パンプ+2。ただし毎ターン、集中力-1');
  if(v.pw==='creatine')L.push('パンプ+2');
  if(v.pw==='allout')L.push('スタミナを使い切ったターン、カードを2枚引く');
  if(v.pw==='memory')L.push('この戦闘の部位の刺激が2倍');
  const kw=[]; if(v.ex)kw.push('出し切り'); if(v.keep)kw.push('キープ'); if(v.eth)kw.push('刹那');
  if(kw.length)L.push(kw.join('・'));
  return L.join('<br>');
}

function cardHTML(c,opts={}){
  const def=CARDS[c.id], v=vals(c.id);
  const cls='t-'+def.t;
  const cost=def.c<0?'':(def.c);
  let parts='';
  if(def.t==='tr'&&!def.v.pose){
    parts='<div class="parts">'+PARTS.map(p=>{const n=def.m==='all'?1:(def.p[p]||0);const k=n===0?'':(p===def.m?'p2':'p1');return `<span class="${k}">${PJ[p]}${n>1?'<br>'+'•'.repeat(n):(n?'<br>•':'<br>&nbsp;')}</span>`}).join('')+'</div>';
  }
  let wt='';
  const w=weightView(def);
  if(w){const on=Math.round(Math.min(1,Math.max(0,w.frac))*10);
    wt=`<div class="wt"><div class="lab"><span>${def.w[3]==='回'||def.w[3]==='体操'?'回数':'重量'}</span><span><b>${w.lab}</b> ${w.goal}</span></div><div class="segs">${Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div></div>`}
  const tyLine=`<span class="gem ${def.r}"></span>${TY[def.t]}${def.eq?'・'+EQ[def.eq]:''}`;
  return `<button class="card ${cls} ${opts.sel?'sel':''} ${opts.off?'off':''}" ${opts.act?`data-act="${opts.act}" data-arg="${opts.arg}"`:''} aria-label="${esc(v.name)}">
    <div class="top">${cost!==''?`<span class="cost">${cost}</span>`:''}<span class="nm">${esc(v.name)}${v.tier?' <span class="badge-up">↑</span>':''}</span></div>
    <div class="ty">${tyLine}</div>
    <div class="eff">${cardText(c.id,opts.combat)}</div>${parts}${wt}</button>`;
}

function playCard(hi,ti){
  const C=S.combat, c=C.hand[hi]; if(!c)return;
  const def=CARDS[c.id], v=vals(c.id);
  if(def.t==='cu'){C.log='このカードは使えません';render();return}
  if(def.c>C.energy){C.log='スタミナが足りません';render();return}
  const al=alive();
  let target=null;
  if(needsTarget(c.id)){
    if(al.length===1)target=al[0];
    else if(ti==null){C.sel=(C.sel===hi?null:hi);C.log=C.sel==null?'':'相手を選んでください';render();return}
    else target=C.enemies[ti];
    if(!target||target.hp<=0)return;
  }
  C.energy-=def.c; C.hand.splice(hi,1); C.sel=null; C.log='';
  // damage
  if(def.t==='tr'){
    let base=baseDamage(c.id,v);
    if(C.pw.split&&C.last&&C.last.t==='tr'&&C.last.m&&def.m&&C.last.m!==def.m)base+=3*C.pw.split;
    let hits=v.h||1;
    if(v.combo&&C.last&&C.last.t==='tr'&&C.last.m===def.m)hits+=1;
    for(let k=0;k<hits;k++){if(target.hp<=0)break;hitEnemy(target,dealt(base,target))}
    // stimulus
    let mult=C.stimMult*(C.talk?2:1); C.talk=0;
    if(v.radio)PARTS.forEach(p=>C.stim[p]+=1*mult);
    Object.entries(def.p||{}).forEach(([p,n])=>C.stim[p]+=n*mult);
  }
  if(v.b)C.block+=focusGain(v.b);
  if(v.vu&&target)target.vu+=v.vu;
  if(v.wk&&target)target.wk+=v.wk;
  if(v.self){S.hp-=v.self}
  if(v.cl==='vuln')C.vu=0;
  if(v.cl==='weak')C.wk=0;
  if(v.talk)C.talk=1;
  if(v.dr)drawCards(v.dr);
  if(v.pw){
    if(v.pw==='creatine')C.pump+=2;
    else if(v.pw==='memory')C.stimMult*=2;
    else C.pw[v.pw]=(C.pw[v.pw]||0)+1;
  }
  C.last={t:def.t,m:def.m};
  if(def.t==='mt'){/* powers leave play */}
  else if(v.ex)C.exhaust.push(c); else C.discard.push(c);
  if(C.pw.allout&&C.energy===0&&!C.allOutUsed){C.allOutUsed=true;drawCards(2*C.pw.allout)}
  checkEnd();
}
function hitEnemy(e,d){
  const b=Math.min(e.block,d); e.block-=b; e.hp=Math.max(0,e.hp-(d-b));
  FX.push({who:'u-e'+S.combat.enemies.indexOf(e),t:d-b>0?'-'+(d-b):'防御',blk:d-b<=0});
}
function checkEnd(){
  if(S.hp<=0){S.hp=0;S.screen='dead';render();return true}
  if(alive().length===0){endCombat();return true}
  render();return false;
}
function endTurn(){
  const C=S.combat;
  const keep=[];
  C.hand.forEach(c=>{const v=vals(c.id);if(v.keep)keep.push(c);else if(v.eth)C.exhaust.push(c);else C.discard.push(c)});
  C.hand=keep; C.tempPump=0; C.sel=null;
  if(C.wk>0)C.wk--; if(C.vu>0)C.vu--;
  // enemy turn
  const lines=[];
  for(const e of alive()){
    e.block=0;
    const m=curMove(e);
    if(m.a){for(let k=0;k<m.a[1];k++){let d=m.a[0]+e.pump;if(e.wk>0)d=Math.floor(d*0.75);if(C.vu>0)d=Math.floor(d*1.5);const b=Math.min(C.block,d);C.block-=b;S.hp-=d-b;FX.push({who:'u-me',t:d-b>0?'-'+(d-b):'防御',blk:d-b<=0})}}
    if(m.b)e.block+=m.b;
    if(m.pump)e.pump+=m.pump;
    if(m.wk)C.wk+=m.wk;
    if(m.vu)C.vu+=m.vu;
    lines.push(`${e.n}：${m.q}`);
    e.mi++;
    if(e.wk>0)e.wk--; if(e.vu>0)e.vu--;
  }
  C.log=lines.join(' ／ ');
  if(S.hp<=0){S.hp=0;S.screen='dead';render();return}
  startTurn(); render();
}
function useSupp(i){
  const s=S.supps[i]; const C=S.combat;
  if(s==='zma'){S.zma=true}
  else if(s==='eaa'){S.hp=Math.min(maxHp(),S.hp+20)}
  else{
    if(!C)return;
    if(s==='caffeine')C.energy+=2;
    if(s==='creatine_s')C.tempPump+=3;
    if(s==='prewo')drawCards(3);
    if(s==='vitamin'){C.wk=0;C.vu=0}
    if(s==='bcaa')C.block+=12;
    if(s==='pbar')C.stimMult*=1.5;
  }
  S.supps.splice(i,1); closeModal(); render();
}

function snapshotTiers(){const o={};new Set(S.deck.map(c=>c.id)).forEach(id=>o[id]=tierOf(CARDS[id]));return o}
function weightsSnap(){const o={};new Set(S.deck.map(c=>c.id)).forEach(id=>{const w=weightView(CARDS[id]);if(w)o[id]=w.lab});return o}
function gainLevels(add){ // add: {part: levels}
  const t0=snapshotTiers(), w0=weightsSnap(), hp0=maxHp();
  Object.entries(add).forEach(([p,n])=>S.parts[p].lv+=n);
  const hp1=maxHp(); if(hp1>hp0)S.hp+=hp1-hp0;
  return diffCards(t0,w0);
}
function diffCards(t0,w0){
  const t1=snapshotTiers(), w1=weightsSnap(), out=[];
  Object.keys(t1).forEach(id=>{
    if(t1[id]>t0[id])out.push(`<b class="badge-up">強化！</b> ${esc(CARDS[id].n)} → ${esc(vals(id).name)}（${w1[id]||''}）`);
    else if(w0[id]&&w1[id]!==w0[id])out.push(`${esc(vals(id).name)}：${w0[id]} → ${w1[id]}`);
  });
  return out;
}
function endCombat(){
  const C=S.combat;
  const stim={...C.stim};
  if(S.gears.includes('notebook')){const top=PARTS.reduce((a,p)=>stim[p]>stim[a]?p:a,PARTS[0]);if(stim[top]>0)stim[top]=Math.round(stim[top]*1.5)}
  const t0=snapshotTiers(), w0=weightsSnap(), hp0=maxHp();
  const lv0=Object.fromEntries(PARTS.map(p=>[p,S.parts[p].lv]));
  PARTS.forEach(p=>{const s=S.parts[p];s.xp+=Math.round(stim[p]);while(s.xp>=need(s.lv)){s.xp-=need(s.lv);s.lv++}});
  const hp1=maxHp(); if(hp1>hp0)S.hp+=hp1-hp0;
  if(S.gears.includes('shoes'))S.hp=Math.min(maxHp(),S.hp+6);
  S.result={stim,lv0,cards:diffCards(t0,w0),kind:C.kind};
  // rewards
  const k=C.kind; const R={gold:k==='boss'?100:k==='elite'?rnd(25,35):rnd(10,20),cards:cardChoices(k),supp:(k!=='boss'&&Math.random()<0.4)?pick(Object.keys(SUPPS)):null,gear:k==='elite'?randomGear():null,taken:{}};
  S.reward=R; S.combat=null; S.screen='result'; render();
}
function cardChoices(kind){
  const out=[];
  while(out.length<3){
    let x=Math.random()*100,r;
    if(kind==='boss')r='R'; else if(kind==='elite')r=x<50?'C':x<88?'U':'R'; else r=x<60?'C':x<95?'U':'R';
    const c=pick(POOL.filter(id=>CARDS[id].r===r&&!out.includes(id)));
    if(c)out.push(c);
  }
  return out;
}
function randomGear(){const left=GEAR_POOL.filter(g=>!S.gears.includes(g));return left.length?pick(left):null}
function addSupp(s){if(S.supps.length>=3)return false;S.supps.push(s);return true}

  if(m.pump)p.push(`<span class="buf">強化</span>`);
  if(m.wk||m.vu)p.push(`<span class="deb">煽り</span>`);
  return `<div class="intent" style="bottom:${sprH+60}px"><div class="ic">${p.join('')}</div><div class="q">${esc(m.q)}</div></div>`;
}
function combatHTML(){
  const C=S.combat, SC=2.4;
  let h=`<img class="bg" src="${AS}bg_gym.png" alt="" data-act="bg"><div class="floorshade" data-act="bg"></div>`;
  const [ps,pw,ph]=SPR.player;
  h+=`<div class="unit" id="u-me" style="left:200px;bottom:150px"><img class="spr" src="${AS}${ps}.png" alt="ボディビルダー" style="width:${pw*SC}px;height:${ph*SC}px">${hpHTML(S.hp,maxHp(),C.block)}${stHTML(C,true)}</div>`;
  const list=C.enemies, n=list.length, xs=n===1?[700]:n===2?[610,800]:[570,700,830];
  const targeting=C.sel!=null&&needsTarget(C.hand[C.sel]?.id||'');
  list.forEach((e,i)=>{
    const [es,ew,eh]=SPR[e.id]; const sc=ENEMIES[e.id].boss?2.1:ENEMIES[e.id].elite?2.2:SC;
    const tgt=targeting&&e.hp>0;
    h+=`<button class="unit ${e.hp<=0?'dead':''} ${tgt?'target':''}" id="u-e${i}" style="left:${xs[i]}px;bottom:150px" ${e.hp>0?`data-act="target" data-arg="${i}"`:''} aria-label="${esc(e.n)}">
      ${e.hp>0?intentHTML(e,eh*sc):''}<img class="spr" src="${AS}${es}.png" alt="" style="width:${ew*sc}px;height:${eh*sc}px">
      ${hpHTML(e.hp,e.max,e.block)}<span class="ename">${esc(e.n)}</span>${stHTML(e,false)}</button>`;
  });
  h+=`<div class="energy ${C.energy===0?'empty':''}" aria-label="スタミナ">${C.energy}/3</div>`;
  h+=`<button class="pile" style="left:22px" data-act="pile" data-arg="draw">山札<b>${C.draw.length}</b></button>`;
  h+=`<button class="pile" style="right:22px" data-act="pile" data-arg="discard">捨て札<b>${C.discard.length}</b></button>`;
  h+=`<button class="primary endturn" data-act="end">ターン終了</button>`;
  if(C.sel!=null){const id=C.hand[C.sel].id;h+=`<div class="hint">${needsTarget(id)&&alive().length>1?'使う相手をタップ':'もう一度タップで使う'}${CARDS[id].c>C.energy?'（スタミナが足りません）':''}</div>`}
  else if(C.log)h+=`<div class="log">${esc(C.log)}</div>`;
  // hand fan
  const N=C.hand.length, step=Math.min(104,600/Math.max(1,N)), mid=(N-1)/2;
  h+='<div class="hand">'+C.hand.map((c,i)=>{
    const off=i-mid, x=480+off*step-61, rot=off*3.2, y=Math.abs(off)*Math.abs(off)*2.2;
    const sel=C.sel===i, dis=CARDS[c.id].c>C.energy||CARDS[c.id].t==='cu';
    const tf=sel?`translateX(${Math.max(20,Math.min(780,x-30))-x}px) scale(1.5)`:`rotate(${rot}deg) translateY(${y}px)`;
    return `<button class="hcard ${sel?'sel':''} ${dis?'off':''}" style="left:${x}px;transform:${tf};z-index:${10+i}" data-act="play" data-arg="${i}" aria-label="${esc(vals(c.id).name)}">${cardHTML(c,{combat:true})}</button>`;
  }).join('')+'</div>';
  return h;
}
function cardsRow(list,act,opts={}){
  return `<div class="cards">${list.map((c,i)=>`<button class="cw ${opts.big?'big':''} ${opts.off&&opts.off(c,i)?'off':''}" ${act?`data-act="${act}" data-arg="${i}"`:''}>${cardHTML(c)}${opts.under?opts.under(c,i):''}</button>`).join('')}</div>`;
}
function partsHTML(stim){
  return `<div class="bodyparts">${PARTS.map(p=>{const s=S.parts[p];return `<div class="bp"><div class="t"><span>${PJL[p]}</span><b>Lv${s.lv}</b></div><div class="xp"><i style="width:${Math.min(100,s.xp/need(s.lv)*100)}%"></i></div><div class="small muted">次まで ${need(s.lv)-s.xp}</div>${stim&&stim[p]?`<div class="stim">刺激 +${Math.round(stim[p])}</div>`:''}</div>`}).join('')}</div>`;
}
function resultHTML(){
  const R=S.result;
  return `<div class="panel"><h2>${R.kind==='boss'?'大会優勝！':'勝利！'} トレーニングの成果</h2>
   <div class="small muted">戦闘中に溜まった刺激が、部位のレベルに変わりました。</div>${partsHTML(R.stim)}
   <div class="list">${PARTS.filter(p=>S.parts[p].lv>R.lv0[p]).map(p=>`<div class="it">${PJL[p]} Lv${R.lv0[p]} → <b>Lv${S.parts[p].lv}</b></div>`).join('')}${R.cards.map(t=>`<div class="it">${t}</div>`).join('')}</div>
   <div><button class="primary" data-act="to-reward">報酬へ</button></div></div>`;
}
function rewardHTML(){
  const R=S.reward, items=[];
  items.push(R.taken.gold?`<div class="it muted">ゴールド ${R.gold} を受け取った</div>`:`<button data-act="r-gold">ゴールド ${R.gold} を受け取る</button>`);
  if(R.supp)items.push(R.taken.supp?`<div class="it muted">${esc(SUPPS[R.supp].n)} を受け取った</div>`:`<button data-act="r-supp" ${S.supps.length>=3?'disabled':''}>サプリ：${esc(SUPPS[R.supp].n)}（${esc(SUPPS[R.supp].d)}）${S.supps.length>=3?' ※いっぱい':''}</button>`);
  if(R.gear)items.push(R.taken.gear?`<div class="it muted">${esc(GEARS[R.gear].n)} を受け取った</div>`:`<button data-act="r-gear">ギア：${esc(GEARS[R.gear].n)}（${esc(GEARS[R.gear].d)}）</button>`);
  const cards=R.taken.card?`<div class="it muted">${R.taken.card==='skip'?'カードは取らなかった':'カードを取った'}</div>`:
   `<h3>カードを1枚選ぶ</h3>${cardsRow(R.cards.map(id=>({id})),'r-card',{big:true})}<div><button data-act="r-skip">カードを取らない</button></div>`;
  return `<div class="panel"><h2>報酬</h2><div class="list">${items.join('')}</div>${cards}<div><button class="primary" data-act="r-done">${S.result&&S.result.kind==='boss'?'結果を見る':'マップに戻る'}</button></div></div>`;
}
function restHTML(){
  const heal=Math.round(maxHp()*0.3)*(S.zma?2:1);
  return `<div class="panel" style="max-width:640px"><h2>休養日</h2><div class="muted">今日はトレーニングを休む日。どう過ごす？（1つだけ）</div><div class="choices">
   <button class="choice" data-act="rest-heal">休む<small>メンタルを${heal}回復${S.zma?'（ZMAで2倍）':''}</small></button>
   <button class="choice" data-act="rest-push">追い込み<small>好きな部位を1つ選んで、レベル+1</small></button>
   <button class="choice" data-act="rest-remove">メニュー見直し<small>デッキからカードを1枚削除</small></button></div></div>`;
}
function shopHTML(){
  const sh=S.shop;
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>マッスルショップ</h2><button class="primary" data-act="leave">店を出る</button></div>
   <div class="muted small">「いらっしゃい！ 今日も仕上がってるね！」</div>
   ${cardsRow(sh.cards.map(x=>({id:x.id})),'buy-card',{off:(c,i)=>sh.cards[i].sold||S.gold<sh.cards[i].price,under:(c,i)=>`<span class="price">${sh.cards[i].sold?'売り切れ':sh.cards[i].price+'G'}</span>`})}
   <div class="choices">
    ${sh.gears.map((g,i)=>`<button class="choice" data-act="buy-gear" data-arg="${i}" ${g.sold||S.gold<g.price?'disabled':''}>ギア：${esc(GEARS[g.id].n)}　<span class="price">${g.sold?'売り切れ':g.price+'G'}</span><small>${esc(GEARS[g.id].d)}</small></button>`).join('')}
    ${sh.supps.map((s,i)=>`<button class="choice" data-act="buy-supp" data-arg="${i}" ${s.sold||S.gold<s.price||S.supps.length>=3?'disabled':''}>サプリ：${esc(SUPPS[s.id].n)}　<span class="price">${s.sold?'売り切れ':s.price+'G'}</span><small>${esc(SUPPS[s.id].d)}</small></button>`).join('')}
    <button class="choice" data-act="buy-pt" ${sh.pt.sold||S.gold<sh.pt.price?'disabled':''}>パーソナルトレーニング　<span class="price">${sh.pt.sold?'売り切れ':sh.pt.price+'G'}</span><small>好きな部位のレベル+1</small></button>
    <button class="choice" data-act="buy-rm" ${sh.rmSold||S.gold<sh.rmPrice?'disabled':''}>カード削除　<span class="price">${sh.rmSold?'売り切れ':sh.rmPrice+'G'}</span><small>デッキからカードを1枚削除</small></button>
   </div></div>`;
}
function eventHTML(){
  const ev=EVENTS[S.event.i];
  if(S.event.out!=null)return `<div class="panel" style="max-width:640px"><h2>${esc(ev.n)}</h2><div>${S.event.out}</div><div><button class="primary" data-act="leave">マップに戻る</button></div></div>`;
  return `<div class="panel" style="max-width:640px"><h2>${esc(ev.n)}</h2><div>${esc(ev.t)}</div><div class="choices">${ev.ch.map((c,i)=>`<button class="choice" data-act="ev" data-arg="${i}" ${c.can&&!c.can()?'disabled':''}>${esc(c.l)}<small>${esc(c.d)}</small></button>`).join('')}</div></div>`;
}
function chestHTML(){
  const g=S.chestGear;
  return `<div class="panel" style="max-width:640px"><h2>ロッカー</h2><div class="muted">誰かが置き忘れたロッカーに、何か入っている。</div>${g?`<div class="list"><div class="it"><b>${esc(GEARS[g].n)}</b><br><span class="small muted">${esc(GEARS[g].d)}</span></div></div><div><button class="gold" data-act="chest-take">受け取る</button></div>`:'<div class="muted">空っぽだった。</div><div><button data-act="leave">マップに戻る</button></div>'}</div>`;
}

// ====== modals ======
let MODAL=null, PICK=null;
function openModal(html){MODAL=html;renderModal()}
function closeModal(){MODAL=null;PICK=null;renderModal()}
function renderModal(){document.getElementById('mlayer').innerHTML=MODAL?`<div class="modal" data-act="modal-bg"><div class="box" role="dialog" aria-modal="true">${MODAL}</div></div>`:''}
function openPick(title,cards,fn){PICK={cards,fn};openModal(`<div class="row" style="justify-content:space-between"><h3>${esc(title)}</h3><button data-act="close">やめる</button></div>${cardsRow(cards,'pick')}`)}
function deckModal(list,title){
  const sorted=list.slice().sort((a,b)=>CARDS[a.id].t.localeCompare(CARDS[b.id].t)||a.id.localeCompare(b.id));
  openModal(`<div class="row" style="justify-content:space-between"><h3>${title}（${list.length}枚）</h3><button data-act="close">閉じる</button></div>${cardsRow(sorted,null)}`);
}
function partsModal(){const C=S.combat;openModal(`<div class="row" style="justify-content:space-between"><h3>部位</h3><button data-act="close">閉じる</button></div>${partsHTML(C?C.stim:null)}${C?'<div class="small muted">黄色の数字は、この戦闘で溜まった刺激です。戦闘が終わるとレベルに変わります。</div>':''}`)}
function gearModal(g){openModal(`<h3>${esc(GEARS[g].n)}</h3><div>${esc(GEARS[g].d)}</div><div><button data-act="close">閉じる</button></div>`)}
function suppModal(i){const s=SUPPS[S.supps[i]];const can=S.combat||!s.combat;openModal(`<h3>${esc(s.n)}</h3><div>${esc(s.d)}</div><div class="row"><button class="primary" data-act="use-supp" data-arg="${i}" ${can?'':'disabled'}>使う</button><button data-act="discard-supp" data-arg="${i}">捨てる</button><button data-act="close">閉じる</button></div>${can?'':'<div class="small muted">戦闘中に使えます</div>'}`)}
function partChoiceModal(title,fn){PICK={part:fn};openModal(`<div class="row" style="justify-content:space-between"><h3>${esc(title)}</h3><button data-act="close">やめる</button></div><div class="bodyparts">${PARTS.map(p=>`<button class="bp" data-act="pick-part" data-arg="${p}"><div class="t"><span>${PJL[p]}</span><b>Lv${partLevel(p)}</b></div></button>`).join('')}</div>`)}
function msgModal(html){openModal(`<div>${html}</div><div><button class="primary" data-act="close">OK</button></div>`)}

// ====== input ======
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act, arg=el.dataset.arg;
  if(act==='modal-bg'){if(e.target===el)closeModal();return}
  switch(act){
   case 'new':newGame();closeModal();render();break;
   case 'deck':deckModal(S.deck,'デッキ');break;
   case 'pile':deckModal(S.combat[arg],arg==='draw'?'山札（順番はシャッフル済み）':'捨て札');break;
   case 'parts':partsModal();break;
   case 'gear':gearModal(arg);break;
   case 'supp':suppModal(+arg);break;
   case 'use-supp':useSupp(+arg);break;
   case 'discard-supp':S.supps.splice(+arg,1);closeModal();render();break;
   case 'close':closeModal();break;
   case 'bg':if(S.combat&&S.combat.sel!=null){S.combat.sel=null;render()}break;
   case 'go':{const [r,i]=arg.split(',').map(Number);enterNode(r,i);break}
   case 'play':{const C=S.combat,i=+arg;
     if(C.sel!==i){C.sel=i;C.log='';render();break}
     const id=C.hand[i].id;
     if(needsTarget(id)&&alive().length>1){render();break}
     playCard(i,null);break}
   case 'target':{const C=S.combat;if(C.sel!=null&&needsTarget(C.hand[C.sel].id))playCard(C.sel,+arg);break}
   case 'end':endTurn();break;
   case 'to-reward':S.screen='reward';render();break;
   case 'r-gold':S.gold+=S.reward.gold;S.reward.taken.gold=1;render();break;
   case 'r-supp':if(addSupp(S.reward.supp))S.reward.taken.supp=1;render();break;
   case 'r-gear':S.gears.push(S.reward.gear);S.reward.taken.gear=1;render();break;
   case 'r-card':S.deck.push(mk(S.reward.cards[+arg]));S.reward.taken.card=1;render();break;
   case 'r-skip':S.reward.taken.card='skip';render();break;
   case 'r-done':S.screen=(S.result&&S.result.kind==='boss')?'win':'map';render();break;
   case 'rest-heal':S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*0.3)*(S.zma?2:1));S.zma=false;S.screen='map';render();break;
   case 'rest-push':partChoiceModal('追い込み：鍛える部位を選ぶ',p=>{const r=gainLevels({[p]:1});S.screen='map';render();msgModal(`${PJL[p]} Lv+1`+(r.length?'<br>'+r.join('<br>'):''))});break;
   case 'rest-remove':openPick('メニュー見直し：外すカードを選ぶ',S.deck,c=>{S.deck=S.deck.filter(x=>x.uid!==c.uid);S.screen='map';return `「${vals(c.id).name}」をデッキから外した。`});break;
   case 'pick':{const P=PICK;if(!P||!P.cards)break;const c=P.cards[+arg];closeModal();const m=P.fn(c);if(S.screen==='event'&&S.event)S.event.out=m;render();if(S.screen!=='event'&&m)msgModal(m);break}
   case 'pick-part':{const fn=PICK&&PICK.part;closeModal();if(fn)fn(arg);break}
   case 'ev':{const ev=EVENTS[S.event.i];const out=ev.ch[+arg].f();if(out!=null)S.event.out=out;if(S.hp<=0){S.hp=0;S.screen='dead'}render();break}
   case 'leave':S.screen='map';S.event=null;S.shop=null;render();break;
   case 'chest-take':if(S.chestGear)S.gears.push(S.chestGear);S.chestGear=null;S.screen='map';render();break;
   case 'buy-card':{const x=S.shop.cards[+arg];if(x.sold||S.gold<x.price)break;S.gold-=x.price;x.sold=true;S.deck.push(mk(x.id));render();break}
   case 'buy-gear':{const x=S.shop.gears[+arg];if(x.sold||S.gold<x.price)break;S.gold-=x.price;x.sold=true;S.gears.push(x.id);render();break}
   case 'buy-supp':{const x=S.shop.supps[+arg];if(x.sold||S.gold<x.price||S.supps.length>=3)break;S.gold-=x.price;x.sold=true;addSupp(x.id);render();break}
   case 'buy-pt':{const sh=S.shop;partChoiceModal('パーソナルトレーニング：鍛える部位を選ぶ',p=>{sh.pt.sold=true;S.gold-=sh.pt.price;const r=gainLevels({[p]:1});render();msgModal(`トレーナーと${PJL[p]}を集中的に鍛えた。${PJL[p]} Lv+1`+(r.length?'<br>'+r.join('<br>'):''))});break}
   case 'buy-rm':{const sh=S.shop;openPick('カード削除：外すカードを選ぶ',S.deck,c=>{S.gold-=sh.rmPrice;sh.rmSold=true;S.removeCount++;S.deck=S.deck.filter(x=>x.uid!==c.uid);return `「${vals(c.id).name}」をデッキから外した。`});break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(MODAL)closeModal();else if(S&&S.combat&&S.combat.sel!=null){S.combat.sel=null;render()}}
});

// ====== stage fit / rotate hint ======
let rotOk=false;
function fit(){
  const w=document.getElementById('wrap'), st=document.getElementById('stage'), cs=getComputedStyle(w);
  const pl=parseFloat(cs.paddingLeft)||0, pt=parseFloat(cs.paddingTop)||0;
  const aw=w.clientWidth-pl-(parseFloat(cs.paddingRight)||0), ah=w.clientHeight-pt-(parseFloat(cs.paddingBottom)||0);
  const s=Math.min(aw/960,ah/540);
  st.style.transform=`scale(${s})`; st.style.left=(pl+(aw-960*s)/2)+'px'; st.style.top=(pt+(ah-540*s)/2)+'px';
  document.getElementById('rot').style.display=(!rotOk&&innerHeight>innerWidth*1.1)?'flex':'none';
}
document.getElementById('rotok').addEventListener('click',()=>{rotOk=true;fit()});
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,200));
document.getElementById('stage').innerHTML='<div id="scene"></div><div id="mlayer"></div>';
fit();

// ====== boot (keeps a running game across page updates) ======
function start(data){
  try{if(data&&data.S&&data.S.v===1){S=data.S;UID=data.UID||1000}}catch(_){S=null}
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UID}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
