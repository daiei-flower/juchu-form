<title>筋肉カードゲーム 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width column — status bar, then the current scene (map / battle / reward…) */
:root{
  --bg:#16130f; --panel:#24201b; --panel2:#2f2a24; --line:#4a423a;
  --fg:#f3ece2; --muted:#b3a79a; --dim:#7d7368;
  --red:#d2492e; --red-l:#f1c9b8; --blue:#3e7cc4; --purple:#8a5cc0; --gold:#e9b13a;
  --green:#6dbb6a; --orange:#e8603f; --cream:#fff6e8; --ink:#1e1a17;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:500;font-size:14px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
#app{max-width:560px;margin:0 auto;padding-block:8px 40px;display:flex;flex-direction:column;gap:10px}
button{font-family:var(--body);font-weight:700;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--muted)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* status bar */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--display);font-weight:400}
.chip.hp b{color:var(--green)} .chip.gold b{color:var(--gold)}
.chip.btn{cursor:pointer}
.supp{border-style:dashed}
.gears{display:flex;flex-wrap:wrap;gap:4px}
.gear{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}

/* map */
.map{position:relative;width:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-family:var(--display);font-size:13px;border:2px solid var(--line);background:var(--panel)}
.node.n-enemy{color:var(--fg)} .node.n-elite{color:var(--orange);border-color:#7a3a28}
.node.n-rest{color:var(--green)} .node.n-shop{color:var(--gold)} .node.n-event{color:#9fc3ff}
.node.n-chest{color:var(--gold)} .node.n-boss{width:64px;height:64px;font-size:15px;color:#fff;background:var(--red);border-color:var(--red)}
.node.avail{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,177,58,.25);animation:pulse 1.4s infinite}
.node.done{opacity:.35}
.node.here{background:var(--gold);color:var(--ink);opacity:1}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(233,177,58,.08)}}
@media (prefers-reduced-motion:reduce){.node.avail{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}

/* battle */
.enemies{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.enemy{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:default}
.enemy.target{border-color:var(--gold);cursor:pointer}
.enemy.dead{opacity:.3}
.enemy .name{font-family:var(--display);font-size:15px}
.intent{background:var(--panel2);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.intent .q{color:var(--muted)}
.intent .k{font-weight:800}
.k-atk{color:#ff8f73} .k-def{color:#8fc2ff} .k-buf{color:#ffd36b} .k-deb{color:#d7a6ff}
.hpbar{height:10px;border-radius:5px;background:#3a332d;overflow:hidden;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.hpbar.me i{background:var(--green)}
.hptext{font-size:12px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:6px}
.st{display:flex;flex-wrap:wrap;gap:4px}
.st span{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--panel2);border:1px solid var(--line)}
.st .blk{color:#8fc2ff;border-color:#2f5d8a}
.me{display:flex;flex-direction:column;gap:6px}
.energy{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5a5048,#1f1b17);border:3px solid #bdb5ab;display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.piles{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--gold);min-height:18px}
.log{font-size:12px;color:var(--muted);min-height:18px}

/* cards */
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{position:relative;background:#2b2622;border:2px solid var(--line);border-radius:12px;padding:8px 7px 7px;display:flex;flex-direction:column;gap:5px;text-align:left;color:var(--fg);min-height:170px;cursor:pointer;font-weight:500}
.card.t-tr{border-color:var(--red)} .card.t-me{border-color:var(--blue)} .card.t-mt{border-color:var(--purple)} .card.t-cu{border-color:#555;background:#1d1a17}
.card.sel{transform:translateY(-6px);box-shadow:0 6px 0 var(--gold)}
.card.off{opacity:.5}
.card .top{display:flex;gap:6px;align-items:center;min-height:30px}
.cost{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:14px;background:radial-gradient(circle at 35% 35%,#55595f,#202226);border:2px solid #c7ccd2;color:#fff}
.card .nm{font-family:var(--display);font-size:12.5px;line-height:1.15}
.card .ty{font-size:10px;color:var(--muted);display:flex;gap:4px;align-items:center}
.gem{width:7px;height:7px;transform:rotate(45deg);display:inline-block;flex:none}
.gem.C{background:#cfc8bf} .gem.U{background:#7ec3ff} .gem.R{background:#ffd24a} .gem.S{background:#8a8178}
.card .eff{background:var(--cream);color:var(--ink);border-radius:7px;padding:6px 5px;font-size:12px;font-weight:700;line-height:1.35;flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.parts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.parts span{font-size:9.5px;text-align:center;border-radius:3px;background:#3a332d;color:#8c7f73;padding:1px 0;font-weight:800}
.parts .p2{background:var(--red);color:#fff} .parts .p1{background:var(--red-l);color:#5e1d0f}
.wt{display:flex;flex-direction:column;gap:2px}
.wt .lab{font-size:10px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.wt .lab b{color:var(--fg)}
.segs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1px}
.segs i{height:4px;background:#4a423a;border-radius:1px}
.segs i.on{background:var(--orange)}
.badge-up{color:var(--gold);font-weight:800}

/* body parts */
.bodyparts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bp{background:var(--panel2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px}
.bp .t{display:flex;justify-content:space-between;align-items:baseline}
.bp .t b{font-family:var(--display);font-weight:400;font-size:16px}
.xp{height:6px;background:#3a332d;border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold)}
.stim{font-size:11px;color:var(--gold)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,8,6,.78);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.choice{text-align:left;display:flex;flex-direction:column;gap:2px}
.choice small{color:var(--muted);font-weight:500}
.title{padding-block:24px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:34px;line-height:1.1}
.title h1 em{font-style:normal;color:var(--red)}
.rules{font-size:13px;color:var(--muted);line-height:1.7}
.price{font-family:var(--display);color:var(--gold);font-size:13px}
.shopitem{display:flex;flex-direction:column;gap:4px;align-items:stretch}
</style>

<div id="app"></div>
<div id="modal"></div>

// ====== helpers ======
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let UID=1;
const mk=id=>({uid:UID++,id});

let S=null;

function need(lv){return 4+2*lv}
function partLevel(p){return S.parts[p].lv}

// ====== weight / upgrade ======
function cardLevelInfo(def){
  if(!def.w)return null;
  const [st,goal,req,unit]=def.w;
  const L=def.m==='all'?Math.min(...PARTS.map(partLevel)):partLevel(def.m);
  return {st,goal,req,unit,L,step:(goal-st)/req};
}
function tierOf(def){
  const i=cardLevelInfo(def); if(!i)return 0;
  if(i.L<i.req)return 0;
  return def.big3?1+Math.floor((i.L-i.req)/2):1;
}
function fmtW(v,unit){const x=Math.round(v*2)/2;return (Number.isInteger(x)?x:x.toFixed(1))+(unit==='kg'?'kg':unit==='回'?'回':'')}
function weightView(def){
  const i=cardLevelInfo(def); if(!i)return null;
  if(i.unit==='体操'){const t=tierOf(def);return {lab:t?'第2':'第1',goal:t?'':'/ 第2',frac:t?1:Math.min(1,i.L/i.req)}}
  const cur=i.st+i.step*i.L, t=tierOf(def);
  if(!def.big3){
    if(t)return {lab:fmtW(cur,i.unit),goal:'',frac:1};
    return {lab:fmtW(cur,i.unit),goal:'/ '+fmtW(i.goal,i.unit),frac:i.L/i.req};
  }
  const nextL=t===0?i.req:i.req+2*t, prevL=t===0?0:i.req+2*(t-1);
  return {lab:fmtW(cur,i.unit),goal:'/ '+fmtW(i.st+i.step*nextL,i.unit),frac:(i.L-prevL)/(nextL-prevL)};
}
function vals(id){
  const def=CARDS[id]; const t=tierOf(def);
  const v=Object.assign({},def.v,t&&def.u?def.u:{});
  if(def.big3&&t>1){v.d+=4*(t-1)}
  v.name=(t&&def.u&&def.u.n)?def.u.n:def.n+(t?(def.big3?'+'.repeat(t):'+'):'');
  v.tier=t;
  return v;
}

function newGame(){
  UID=1;
  S={v:1,screen:'map',hp:80,maxBase:80,gold:99,deck:STARTER.map(mk),gears:['notebook'],supps:[],
     parts:Object.fromEntries(PARTS.map(p=>[p,{lv:0,xp:0}])),map:genMap(),pos:null,floor:0,
     removeCount:0,zma:false,combat:null,reward:null,shop:null,event:null,result:null,msg:null};
}
function maxHp(){let m=S.maxBase;if(S.gears.includes('belt'))m+=partLevel('leg')+partLevel('back');return m}

// ====== map ======
function genMap(){
  const ROWS=15, rows=[];
  for(let r=0;r<ROWS-1;r++){
    const n=r===0?3:rnd(2,4); const cols=shuffle([0,1,2,3]).slice(0,n).sort((a,b)=>a-b);
    rows.push(cols.map(c=>({r,c,type:'enemy',to:[]})));
  }
  rows.push([{r:ROWS-1,c:1.5,type:'boss',to:[]}]);
  for(let r=0;r<ROWS-2;r++){
    const cur=rows[r],nx=rows[r+1];
    cur.forEach((a,ai)=>{
      let cand=nx.map((b,bi)=>bi).filter(bi=>Math.abs(nx[bi].c-a.c)<=1);
      if(!cand.length){cand=[nx.reduce((best,b,bi)=>Math.abs(b.c-a.c)<Math.abs(nx[best].c-a.c)?bi:best,0)]}
      shuffle(cand).slice(0,Math.random()<0.4?2:1).forEach(bi=>{if(!a.to.includes(bi))a.to.push(bi)});
    });
    nx.forEach((b,bi)=>{
      if(!cur.some(a=>a.to.includes(bi))){
        const ai=cur.reduce((best,a,i)=>Math.abs(a.c-b.c)<Math.abs(cur[best].c-b.c)?i:best,0);
        cur[ai].to.push(bi);
      }
    });
  }
  rows[ROWS-2].forEach(a=>a.to=[0]);
  for(let r=1;r<ROWS-1;r++)rows[r].forEach(nd=>{
    if(r===7){nd.type='chest';return}
    if(r===13){nd.type='rest';return}
    const opts=[['enemy',48],['event',22]];
    if(r>=3)opts.push(['shop',8]);
    if(r>=4)opts.push(['elite',11]);
    if(r>=5&&r!==12)opts.push(['rest',11]);
    let tot=opts.reduce((s,o)=>s+o[1],0),x=Math.random()*tot;
    for(const [t,w] of opts){if((x-=w)<0){nd.type=t;break}}
  });
  return rows;
}
const NODE_LABEL={enemy:'敵',elite:'強',rest:'休',shop:'店',event:'？',chest:'箱',boss:'大会'};
const NODE_NAME={enemy:'ライバル',elite:'強敵',rest:'休養日',shop:'マッスルショップ',event:'イベント',chest:'ロッカー',boss:'大会'};
function availNodes(){
  if(!S.pos)return S.map[0].map((n,i)=>[0,i]);
  const nd=S.map[S.pos[0]][S.pos[1]];
  return nd.to.map(i=>[S.pos[0]+1,i]);
}
function enterNode(r,i){
  const nd=S.map[r][i]; S.pos=[r,i]; S.floor=r+1; nd.done=true;
  if(nd.type==='enemy')startCombat(r<3?pick(ENC_EASY):pick(ENC_NORMAL),'normal');
  else if(nd.type==='elite')startCombat(pick(ENC_ELITE),'elite');
  else if(nd.type==='boss')startCombat(['nushi'],'boss');
  else if(nd.type==='rest'){S.screen='rest'}
  else if(nd.type==='shop'){openShop()}
  else if(nd.type==='event'){openEvent()}
  else if(nd.type==='chest'){const g=randomGear();S.screen='chest';S.chestGear=g}
  render();
}

// ====== combat ======
function startCombat(ids,kind){
  const enemies=ids.map(id=>{const e=ENEMIES[id];const hp=rnd(e.hp[0],e.hp[1]);return {id,n:e.n,hp,max:hp,block:0,pump:0,wk:0,vu:0,mi:0}});
  const draw=shuffle(S.deck.map(c=>({...c})));
  const C=S.combat={kind,enemies,draw,hand:[],discard:[],exhaust:[],energy:3,turn:0,block:0,pump:0,dex:0,wk:0,vu:0,tempPump:0,
    pw:{},stim:Object.fromEntries(PARTS.map(p=>[p,0])),stimMult:1,talk:0,last:null,sel:null,log:'',allOutUsed:false};
  if(S.gears.includes('wrap'))C.pump+=1;
  if(S.gears.includes('shaker'))C.startBlock=(C.startBlock||0)+8;
  if(S.gears.includes('mirror_g'))C.startBlock=(C.startBlock||0)+2*Math.min(...PARTS.map(partLevel));
  if(S.gears.includes('benchrack')&&S.deck.some(c=>c.id==='bench')){const w=CARDS.bench.w;const kg=w[0]+(w[1]-w[0])/w[2]*partLevel('chest');C.pump+=Math.floor(kg/40)}
  S.screen='combat';
  startTurn();
}
function drawCards(n){
  const C=S.combat;
  for(let k=0;k<n;k++){
    if(!C.draw.length){if(!C.discard.length)break;C.draw=shuffle(C.discard);C.discard=[]}
    if(C.hand.length>=10)break;
    C.hand.push(C.draw.pop());
  }
}
function startTurn(){
  const C=S.combat; C.turn++; C.block=C.turn===1?(C.startBlock||0):0; C.energy=3; C.allOutUsed=false;
  if(S.gears.includes('hrm')&&C.turn===3)C.energy+=2;
  if(C.pw.whey)C.block+=3*C.pw.whey;
  if(C.pw.dirty){C.pump+=2*C.pw.dirty;C.dex-=C.pw.dirty}
  drawCards(5+(C.turn===1&&S.gears.includes('gymbag')?2:0));
  C.sel=null;
}
function alive(){return S.combat.enemies.filter(e=>e.hp>0)}
function curMove(e){return ENEMIES[e.id].moves[e.mi%ENEMIES[e.id].moves.length]}

function baseDamage(id,v){
  const def=CARDS[id];
  if(v.pose==='fdb')return PARTS.reduce((s,p)=>s+partLevel(p),0);
  if(v.pose==='sc')return (partLevel('chest')+partLevel('arm'))*2;
  let d=v.d||0;
  if(S.gears.includes('grip')&&def.m==='back'&&partLevel('back')>=5)d+=2;
  return d;
}
function dealt(d,target){
  const C=S.combat; d+=C.pump+C.tempPump;
  if(C.wk>0)d=Math.floor(d*0.75);
  if(target&&target.vu>0)d=Math.floor(d*1.5);
  return Math.max(0,d);
}
function focusGain(b){return Math.max(0,b+S.combat.dex)}
function needsTarget(id){const v=CARDS[id].v;return CARDS[id].t==='tr'||v.vu||v.wk}

function cardText(id,inCombat){
  const def=CARDS[id], v=vals(id); const L=[];
  const C=inCombat?S.combat:null;
  if(def.t==='cu')return v.curse;
  if(v.pose==='fdb')L.push(`全部位のレベル合計のダメージ（今：${inCombat?dealt(baseDamage(id,v)):baseDamage(id,v)}）`);
  else if(v.pose==='sc')L.push(`（胸＋腕のレベル）×2のダメージ（今：${inCombat?dealt(baseDamage(id,v)):baseDamage(id,v)}）`);
  else if(v.d!=null){
    let d=baseDamage(id,v); if(C){d=dealt(d+(C.pw.split&&C.last&&C.last.t==='tr'&&C.last.m&&def.m&&C.last.m!==def.m?3*C.pw.split:0))}
    L.push(`${d}ダメージ${v.h>1?` × ${v.h}回`:''}`);
  }
  if(v.combo)L.push(`直前に${PJL[def.m]}のカードなら、もう1回`);
  if(v.b)L.push(`フォーカス${C?focusGain(v.b):v.b}`);
  if(v.vu)L.push(`相手に動揺${v.vu}`);
  if(v.wk)L.push(`相手にバテ${v.wk}`);
  if(v.dr)L.push(`カードを${v.dr}枚引く`);
  if(v.self)L.push(`自分のメンタル-${v.self}`);
  if(v.radio)L.push('全部位に刺激+1');
  if(v.cl==='vuln')L.push('自分の動揺を消す');
  if(v.cl==='weak')L.push('自分のバテを消す');
  if(v.talk)L.push('次のトレーニングの部位の刺激が2倍');
  if(v.pw==='whey')L.push('毎ターン、フォーカス+3');
  if(v.pw==='split')L.push('直前と違う部位のトレーニングを使うと、ダメージ+3');
  if(v.pw==='dirty')L.push('毎ターン、パンプ+2。ただし毎ターン、集中力-1');
  if(v.pw==='creatine')L.push('パンプ+2');
  if(v.pw==='allout')L.push('スタミナを使い切ったターン、カードを2枚引く');
  if(v.pw==='memory')L.push('この戦闘の部位の刺激が2倍');
  const kw=[]; if(v.ex)kw.push('出し切り'); if(v.keep)kw.push('キープ'); if(v.eth)kw.push('刹那');
  if(kw.length)L.push(kw.join('・'));
  return L.join('<br>');
}

function cardHTML(c,opts={}){
  const def=CARDS[c.id], v=vals(c.id);
  const cls='t-'+def.t;
  const cost=def.c<0?'':(def.c);
  let parts='';
  if(def.t==='tr'&&!def.v.pose){
    parts='<div class="parts">'+PARTS.map(p=>{const n=def.m==='all'?1:(def.p[p]||0);const k=n===0?'':(p===def.m?'p2':'p1');return `<span class="${k}">${PJ[p]}${n>1?'<br>'+'•'.repeat(n):(n?'<br>•':'<br>&nbsp;')}</span>`}).join('')+'</div>';
  }
  let wt='';
  const w=weightView(def);
  if(w){const on=Math.round(Math.min(1,Math.max(0,w.frac))*10);
    wt=`<div class="wt"><div class="lab"><span>${def.w[3]==='回'||def.w[3]==='体操'?'回数':'重量'}</span><span><b>${w.lab}</b> ${w.goal}</span></div><div class="segs">${Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div></div>`}
  const tyLine=`<span class="gem ${def.r}"></span>${TY[def.t]}${def.eq?'・'+EQ[def.eq]:''}`;
  return `<button class="card ${cls} ${opts.sel?'sel':''} ${opts.off?'off':''}" ${opts.act?`data-act="${opts.act}" data-arg="${opts.arg}"`:''} aria-label="${esc(v.name)}">
    <div class="top">${cost!==''?`<span class="cost">${cost}</span>`:''}<span class="nm">${esc(v.name)}${v.tier?' <span class="badge-up">↑</span>':''}</span></div>
    <div class="ty">${tyLine}</div>
    <div class="eff">${cardText(c.id,opts.combat)}</div>${parts}${wt}</button>`;
}

function playCard(hi,ti){
  const C=S.combat, c=C.hand[hi]; if(!c)return;
  const def=CARDS[c.id], v=vals(c.id);
  if(def.t==='cu'){C.log='このカードは使えません';render();return}
  if(def.c>C.energy){C.log='スタミナが足りません';render();return}
  const al=alive();
  let target=null;
  if(needsTarget(c.id)){
    if(al.length===1)target=al[0];
    else if(ti==null){C.sel=(C.sel===hi?null:hi);C.log=C.sel==null?'':'相手を選んでください';render();return}
    else target=C.enemies[ti];
    if(!target||target.hp<=0)return;
  }
  C.energy-=def.c; C.hand.splice(hi,1); C.sel=null; C.log='';
  // damage
  if(def.t==='tr'){
    let base=baseDamage(c.id,v);
    if(C.pw.split&&C.last&&C.last.t==='tr'&&C.last.m&&def.m&&C.last.m!==def.m)base+=3*C.pw.split;
    let hits=v.h||1;
    if(v.combo&&C.last&&C.last.t==='tr'&&C.last.m===def.m)hits+=1;
    for(let k=0;k<hits;k++){if(target.hp<=0)break;hitEnemy(target,dealt(base,target))}
    // stimulus
    let mult=C.stimMult*(C.talk?2:1); C.talk=0;
    if(v.radio)PARTS.forEach(p=>C.stim[p]+=1*mult);
    Object.entries(def.p||{}).forEach(([p,n])=>C.stim[p]+=n*mult);
  }
  if(v.b)C.block+=focusGain(v.b);
  if(v.vu&&target)target.vu+=v.vu;
  if(v.wk&&target)target.wk+=v.wk;
  if(v.self){S.hp-=v.self}
  if(v.cl==='vuln')C.vu=0;
  if(v.cl==='weak')C.wk=0;
  if(v.talk)C.talk=1;
  if(v.dr)drawCards(v.dr);
  if(v.pw){
    if(v.pw==='creatine')C.pump+=2;
    else if(v.pw==='memory')C.stimMult*=2;
    else C.pw[v.pw]=(C.pw[v.pw]||0)+1;
  }
  C.last={t:def.t,m:def.m};
  if(def.t==='mt'){/* powers leave play */}
  else if(v.ex)C.exhaust.push(c); else C.discard.push(c);
  if(C.pw.allout&&C.energy===0&&!C.allOutUsed){C.allOutUsed=true;drawCards(2*C.pw.allout)}
  checkEnd();
}
function hitEnemy(e,d){
  const b=Math.min(e.block,d); e.block-=b; e.hp=Math.max(0,e.hp-(d-b));
}
function checkEnd(){
  if(S.hp<=0){S.hp=0;S.screen='dead';render();return true}
  if(alive().length===0){endCombat();return true}
  render();return false;
}
function endTurn(){
  const C=S.combat;
  const keep=[];
  C.hand.forEach(c=>{const v=vals(c.id);if(v.keep)keep.push(c);else if(v.eth)C.exhaust.push(c);else C.discard.push(c)});
  C.hand=keep; C.tempPump=0; C.sel=null;
  if(C.wk>0)C.wk--; if(C.vu>0)C.vu--;
  // enemy turn
  const lines=[];
  for(const e of alive()){
    e.block=0;
    const m=curMove(e);
    if(m.a){for(let k=0;k<m.a[1];k++){let d=m.a[0]+e.pump;if(e.wk>0)d=Math.floor(d*0.75);if(C.vu>0)d=Math.floor(d*1.5);const b=Math.min(C.block,d);C.block-=b;S.hp-=d-b}}
    if(m.b)e.block+=m.b;
    if(m.pump)e.pump+=m.pump;
    if(m.wk)C.wk+=m.wk;
    if(m.vu)C.vu+=m.vu;
    lines.push(`${e.n}：${m.q}`);
    e.mi++;
    if(e.wk>0)e.wk--; if(e.vu>0)e.vu--;
  }
  C.log=lines.join(' ／ ');
  if(S.hp<=0){S.hp=0;S.screen='dead';render();return}
  startTurn(); render();
}
function useSupp(i){
  const s=S.supps[i]; const C=S.combat;
  if(s==='zma'){S.zma=true}
  else if(s==='eaa'){S.hp=Math.min(maxHp(),S.hp+20)}
  else{
    if(!C)return;
    if(s==='caffeine')C.energy+=2;
    if(s==='creatine_s')C.tempPump+=3;
    if(s==='prewo')drawCards(3);
    if(s==='vitamin'){C.wk=0;C.vu=0}
    if(s==='bcaa')C.block+=12;
    if(s==='pbar')C.stimMult*=1.5;
  }
  S.supps.splice(i,1); closeModal(); render();
}

// ====== after combat ======
function snapshotTiers(){const o={};new Set(S.deck.map(c=>c.id)).forEach(id=>o[id]=tierOf(CARDS[id]));return o}
function weightsSnap(){const o={};new Set(S.deck.map(c=>c.id)).forEach(id=>{const w=weightView(CARDS[id]);if(w)o[id]=w.lab});return o}
function gainLevels(add){ // add: {part: levels}
  const t0=snapshotTiers(), w0=weightsSnap(), hp0=maxHp();
  Object.entries(add).forEach(([p,n])=>S.parts[p].lv+=n);
  const hp1=maxHp(); if(hp1>hp0)S.hp+=hp1-hp0;
  return diffCards(t0,w0);
}
function diffCards(t0,w0){
  const t1=snapshotTiers(), w1=weightsSnap(), out=[];
  Object.keys(t1).forEach(id=>{
    if(t1[id]>t0[id])out.push(`<b class="badge-up">強化！</b> ${esc(CARDS[id].n)} → ${esc(vals(id).name)}（${w1[id]||''}）`);
    else if(w0[id]&&w1[id]!==w0[id])out.push(`${esc(vals(id).name)}：${w0[id]} → ${w1[id]}`);
  });
  return out;
}
function endCombat(){
  const C=S.combat;
  const stim={...C.stim};
  if(S.gears.includes('notebook')){const top=PARTS.reduce((a,p)=>stim[p]>stim[a]?p:a,PARTS[0]);if(stim[top]>0)stim[top]=Math.round(stim[top]*1.5)}
  const t0=snapshotTiers(), w0=weightsSnap(), hp0=maxHp();
  const lv0=Object.fromEntries(PARTS.map(p=>[p,S.parts[p].lv]));
  PARTS.forEach(p=>{const s=S.parts[p];s.xp+=Math.round(stim[p]);while(s.xp>=need(s.lv)){s.xp-=need(s.lv);s.lv++}});
  const hp1=maxHp(); if(hp1>hp0)S.hp+=hp1-hp0;
  if(S.gears.includes('shoes'))S.hp=Math.min(maxHp(),S.hp+6);
  S.result={stim,lv0,cards:diffCards(t0,w0),kind:C.kind};
  // rewards
  const k=C.kind; const R={gold:k==='boss'?100:k==='elite'?rnd(25,35):rnd(10,20),cards:cardChoices(k),supp:(k!=='boss'&&Math.random()<0.4)?pick(Object.keys(SUPPS)):null,gear:k==='elite'?randomGear():null,taken:{}};
  S.reward=R; S.combat=null; S.screen='result'; render();
}
function cardChoices(kind){
  const out=[];
  while(out.length<3){
    let x=Math.random()*100,r;
    if(kind==='boss')r='R'; else if(kind==='elite')r=x<50?'C':x<88?'U':'R'; else r=x<60?'C':x<95?'U':'R';

    if(c)out.push(c);

}

}

function stHTML(o,isMe){
  const a=[];
  if(o.block)a.push(`<span class="blk">フォーカス ${o.block}</span>`);
  const pump=o.pump+(isMe?o.tempPump:0);
  if(pump)a.push(`<span>パンプ ${pump}</span>`);
  if(isMe&&o.dex)a.push(`<span>集中力 ${o.dex}</span>`);
  if(o.wk)a.push(`<span>バテ ${o.wk}</span>`);
  if(o.vu)a.push(`<span>動揺 ${o.vu}</span>`);
  if(isMe){Object.entries(o.pw).forEach(([k,n])=>a.push(`<span>${({whey:'ホエイ',split:'分割法',dirty:'ダーティバルク',allout:'オールアウト'})[k]}${n>1?'×'+n:''}</span>`));if(o.stimMult>1)a.push(`<span>刺激×${o.stimMult}</span>`);if(o.talk)a.push('<span>次の刺激×2</span>')}

}

  const ev=EVENTS[S.event.i];
  if(S.event.out!=null)return `<div class="panel"><h2>${esc(ev.n)}</h2><div>${S.event.out}</div><button class="primary" data-act="leave">マップに戻る</button></div>`;
  return `<div class="panel"><h2>${esc(ev.n)}</h2><div>${esc(ev.t)}</div>${ev.ch.map((c,i)=>`<button class="choice" data-act="ev" data-arg="${i}" ${c.can&&!c.can()?'disabled':''}>${esc(c.l)}<small>${esc(c.d)}</small></button>`).join('')}</div>`;
}
function chestHTML(){
  const g=S.chestGear;
  return `<div class="panel"><h2>ロッカー</h2><div class="muted">誰かが置き忘れたロッカーに、何か入っている。</div>${g?`<div class="it list"><div class="it"><b>${esc(GEARS[g].n)}</b><br><span class="small muted">${esc(GEARS[g].d)}</span></div></div><button class="gold" data-act="chest-take">受け取る</button>`:'<div class="muted">空っぽだった。</div>'}<button data-act="leave">マップに戻る</button></div>`;
}
function msgModal(html){openModal(`<div>${html}</div><button class="primary" data-act="close">OK</button>`)}

// ====== events wiring ======
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act, arg=el.dataset.arg;
  if(act==='modal-bg'){if(e.target===el)closeModal();return}
  switch(act){
   case 'new':newGame();closeModal();render();break;
   case 'deck':deckModal();break;
   case 'parts':partsModal();break;
   case 'gear':gearModal(arg);break;
   case 'supp':suppModal(+arg);break;
   case 'use-supp':useSupp(+arg);break;
   case 'discard-supp':S.supps.splice(+arg,1);closeModal();render();break;
   case 'close':closeModal();break;
   case 'go':{const [r,i]=arg.split(',').map(Number);enterNode(r,i);break}
   case 'play':playCard(+arg);break;
   case 'target':{const C=S.combat;if(C.sel!=null)playCard(C.sel,+arg);break}
   case 'end':endTurn();break;
   case 'to-reward':S.screen='reward';render();break;
   case 'r-gold':S.gold+=S.reward.gold;S.reward.taken.gold=1;render();break;
   case 'r-supp':if(addSupp(S.reward.supp))S.reward.taken.supp=1;render();break;
   case 'r-gear':S.gears.push(S.reward.gear);S.reward.taken.gear=1;{const b=maxHp();}render();break;
   case 'r-card':S.deck.push(mk(S.reward.cards[+arg]));S.reward.taken.card=1;render();break;
   case 'r-skip':S.reward.taken.card='skip';render();break;
   case 'r-done':if(S.result&&S.result.kind==='boss'){S.screen='win'}else S.screen='map';render();break;
   case 'rest-heal':S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*0.3)*(S.zma?2:1));S.zma=false;S.screen='map';render();break;
   case 'rest-push':partChoiceModal('追い込み：鍛える部位を選ぶ',p=>{const r=gainLevels({[p]:1});S.screen='map';render();msgModal(`${PJL[p]} Lv+1`+(r.length?'<br>'+r.join('<br>'):''))});break;
   case 'rest-remove':openPick('メニュー見直し：外すカードを選ぶ',S.deck,c=>{S.deck=S.deck.filter(x=>x.uid!==c.uid);S.screen='map';return `「${vals(c.id).name}」をデッキから外した。`});break;
   case 'pick':{const P=PICK;const c=P.cards[+arg];closeModal();const m=P.fn(c);if(S.screen==='event'&&S.event)S.event.out=m;render();if(S.screen!=='event'&&m)msgModal(m);break}
   case 'pick-part':{const fn=PICK.part;closeModal();fn(arg);break}
   case 'ev':{const ev=EVENTS[S.event.i];const out=ev.ch[+arg].f();if(out!=null)S.event.out=out;if(S.hp<=0){S.hp=0;S.screen='dead'}render();break}
   case 'leave':S.screen='map';S.event=null;S.shop=null;render();break;
   case 'chest-take':if(S.chestGear)S.gears.push(S.chestGear);S.chestGear=null;S.screen='map';render();break;
   case 'buy-card':{const x=S.shop.cards[+arg];if(x.sold||S.gold<x.price)break;S.gold-=x.price;x.sold=true;S.deck.push(mk(x.id));render();break}
   case 'buy-gear':{const x=S.shop.gears[+arg];if(x.sold||S.gold<x.price)break;S.gold-=x.price;x.sold=true;S.gears.push(x.id);render();break}
   case 'buy-supp':{const x=S.shop.supps[+arg];if(x.sold||S.gold<x.price||S.supps.length>=3)break;S.gold-=x.price;x.sold=true;addSupp(x.id);render();break}
   case 'buy-pt':{const sh=S.shop;partChoiceModal('パーソナルトレーニング：鍛える部位を選ぶ',p=>{sh.pt.sold=true;S.gold-=sh.pt.price;const r=gainLevels({[p]:1});render();msgModal(`トレーナーと${PJL[p]}を集中的に鍛えた。${PJL[p]} Lv+1`+(r.length?'<br>'+r.join('<br>'):''))});break}
   case 'buy-rm':{const sh=S.shop;openPick('カード削除：外すカードを選ぶ',S.deck,c=>{S.gold-=sh.rmPrice;sh.rmSold=true;S.removeCount++;S.deck=S.deck.filter(x=>x.uid!==c.uid);return `「${vals(c.id).name}」をデッキから外した。`});break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal()});

// ====== boot (keeps a running game across page updates) ======
function start(data){
  try{if(data&&data.S&&data.S.v===1){S=data.S;UID=data.UID||1000}}catch(_){S=null}
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UID}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
